name: Profile assets

# Gera todos os SVGs do perfil em um único job e publica na branch `output`.
# Um só workflow evita que publicações concorrentes sobrescrevam arquivos umas das outras.
#
# PROFILE_STATS_TOKEN: PAT somente leitura do dono do perfil, usado apenas nos passos que
# LEEM dados (contribuições e repositórios privados). A publicação usa o GITHUB_TOKEN.

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-assets.yml

permissions: {}

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    name: Generate and publish SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman
          github_token: ${{ secrets.PROFILE_STATS_TOKEN }}
        # Gera dist/pacman-contribution-graph.svg e dist/pacman-contribution-graph-dark.svg

      - name: Generate stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: stats
          path: dist/stats-dark.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: "true"
          options: >-
            username=${{ github.repository_owner }}&locale=pt-br&show_icons=true&include_all_commits=true&count_private=true&hide=stars,prs,issues,contribs&hide_rank=true&hide_border=false&border_color=1A5AF0&border_radius=8&bg_color=0B1B33&title_color=14C2E5&text_color=F6F8FB&icon_color=1A5AF0

      - name: Generate stats card (light)
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: stats
          path: dist/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: "true"
          options: >-
            username=${{ github.repository_owner }}&locale=pt-br&show_icons=true&include_all_commits=true&count_private=true&hide=stars,prs,issues,contribs&hide_rank=true&hide_border=false&border_color=1A5AF0&border_radius=8&bg_color=F6F8FB&title_color=1A5AF0&text_color=0B1B33&icon_color=14C2E5

      - name: Generate top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: top-langs
          path: dist/top-langs-dark.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: "true"
          options: >-
            username=${{ github.repository_owner }}&locale=pt-br&layout=compact&langs_count=8&hide_border=false&border_color=1A5AF0&border_radius=8&bg_color=0B1B33&title_color=14C2E5&text_color=F6F8FB

      - name: Generate top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: top-langs
          path: dist/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: "true"
          options: >-
            username=${{ github.repository_owner }}&locale=pt-br&layout=compact&langs_count=8&hide_border=false&border_color=1A5AF0&border_radius=8&bg_color=F6F8FB&title_color=1A5AF0&text_color=0B1B33

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
